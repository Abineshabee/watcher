[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "watcher"
version = "0.1.0"
description = "Silent data watcher — tells you what your pipeline did to your data."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Abineshabee" },
    { email = "abineshabee@gmail.com" },
]
keywords = ["dataframe", "pipeline", "data-quality", "pandas", "etl", "debugging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5",
]

# ---------------------------------------------------------------------------
# Optional dependency groups
# ---------------------------------------------------------------------------
[project.optional-dependencies]
rich   = ["rich>=13.0"]
memory = ["psutil>=5.9"]
full   = ["rich>=13.0", "psutil>=5.9"]
dev    = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "numpy>=1.24",
    "rich>=13.0",
    "psutil>=5.9",
]

# ---------------------------------------------------------------------------
# Package discovery
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where   = ["."]
include = ["watcher*"]

# ---------------------------------------------------------------------------
# pytest configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
filterwarnings = [
    "default::watcher.exceptions.WatcherWarning",
]

# ---------------------------------------------------------------------------
# Coverage configuration
# ---------------------------------------------------------------------------
[tool.coverage.run]
source         = ["watcher"]
branch         = true
relative_files = true
# Do NOT omit watcher/__init__.py — it is covered and counts toward the
# 80 % threshold.  The conftest.py module-reload trick ensures it is traced.

[tool.coverage.report]
show_missing  = true
skip_covered  = false
fail_under    = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.\\s*$",        # standalone protocol / abstract-method stubs only
]

[tool.coverage.paths]
# Map coverage hits back to the source tree regardless of how/where the
# package was installed (editable, wheel, CI, local dev, Linux, Windows).
watcher = [
    "watcher",                      # local source, relative to project root
    "*/site-packages/watcher",      # Unix site-packages (non-editable installs)
    "*\\site-packages\\watcher",    # Windows site-packages (non-editable installs)
]
